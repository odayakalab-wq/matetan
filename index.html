<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マテ単</title>
<style>
:root {
  --paper: #FBF7F1;
  --paper-deep: #F3ECE2;
  --card: #FFFFFF;
  --ink: #1F1A17;
  --ink-soft: #6F655C;
  --line: #EFE6DA;
  --accent: #F08A24;
  --accent-deep: #C9650A;
  --shiba-soft: #FFDDB9;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.85;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 16px 64px;
}

header.top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}

header.top img {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(120, 72, 20, 0.16);
}

header.top .app {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-deep);
  letter-spacing: 0.04em;
}

h1 {
  margin: 2px 0 0;
  font-size: 28px;
  line-height: 1.35;
  letter-spacing: 0.02em;
}

.lead {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 20px;
  margin: 0 0 28px;
  box-shadow: 0 2px 0 var(--line);
}

.lead p { margin: 0; }
.lead p + p { margin-top: 8px; }

section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px 22px;
  margin-bottom: 14px;
}

h2 {
  font-size: 18px;
  margin: 0 0 8px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

h2 .no {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--shiba-soft);
  color: var(--accent-deep);
  font-size: 14px;
  transform: translateY(-1px);
}

h3 {
  font-size: 15px;
  margin: 16px 0 4px;
}

p { margin: 0 0 8px; }
ul, ol { margin: 4px 0 8px; padding-left: 1.3em; }
li { margin: 2px 0; }

.note {
  color: var(--ink-soft);
  font-size: 14px;
}

.box {
  background: var(--paper-deep);
  border-radius: 14px;
  padding: 12px 16px;
  margin: 10px 0 4px;
}

a { color: var(--accent-deep); }

footer {
  margin-top: 28px;
  color: var(--ink-soft);
  font-size: 14px;
}

footer nav { margin-top: 10px; }
footer nav a { margin-right: 16px; }

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1C1815;
    --paper-deep: #2A2420;
    --card: #24201C;
    --ink: #F4EEE7;
    --ink-soft: #B9AEA3;
    --line: #3A322B;
    --accent-deep: #FFAE5E;
    --shiba-soft: #4A3420;
  }
  .lead, section { box-shadow: none; }
}
</style>
</head>
